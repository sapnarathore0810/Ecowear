<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECOWEAR: your circular style system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#785A9C; --purple-d:#624586; --on-purple:#FFF8EA;
  --cream:#F6ECD6; --cream2:#FFF8EA; --ink:#2A1D30; --muted:#5B4A66; --ok:#2E7D4F;
  --bd:#2A1D30; --sh:#2A1D30;
  --pink:#E8598B; --yellow:#F2D87C; --green:#A9D9A8; --lav:#C4A9E2; --on-acc:#2A1D30;
  --marble:#D0C4E2; --marble2:#DDD4EC;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --purple:#6B508E; --purple-d:#543C73;
    --cream:#F6ECD6; --cream2:#FFF8EA; --ink:#2A1D30; --muted:#6A5777; --ok:#2E7D4F;
    --bd:#2A1D30; --sh:#2A1D30;
    --pink:#E8598B; --yellow:#F2D87C; --green:#A9D9A8; --lav:#C4A9E2;
    --marble:#D0C4E2; --marble2:#DDD4EC;
  }
}
:root[data-theme="dark"]{
  --purple:#6B508E; --purple-d:#543C73;
  --cream:#F6ECD6; --cream2:#FFF8EA; --ink:#2A1D30; --muted:#6A5777; --ok:#2E7D4F;
  --bd:#2A1D30; --sh:#2A1D30;
  --pink:#E8598B; --yellow:#F2D87C; --green:#A9D9A8; --lav:#B79BE0;
  --marble:#D0C4E2; --marble2:#DDD4EC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--marble);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.45;
  background-image:radial-gradient(var(--marble2) 22%,transparent 23%),radial-gradient(var(--marble2) 16%,transparent 17%);
  background-size:36px 36px,23px 23px;background-position:0 0,11px 17px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.side :focus-visible,.topbar :focus-visible,.wt :focus-visible{outline-color:var(--yellow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--purple);color:var(--on-purple);border-bottom:3px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:1.2rem;padding:.75rem 1.4rem}
.brand{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.bmark{font:700 1.85rem var(--pix);letter-spacing:.11em;text-shadow:1px 1px 0 var(--bd)}
.bsub{font:700 .82rem var(--pix);letter-spacing:.06em;opacity:.95;background:rgba(0,0,0,0.15);padding:.2rem .55rem;border-radius:2px}
.tb-actions{display:flex;gap:.75rem}
.tbtn,.menu-btn{background:var(--cream2);color:var(--ink);border:2.5px solid var(--bd);box-shadow:3px 3px 0 var(--sh);padding:.4rem .95rem;font:700 .78rem var(--pix);letter-spacing:.07em;cursor:pointer;transition:transform .1s,box-shadow .1s}
.tbtn:hover,.menu-btn:hover{background:var(--yellow);color:var(--on-acc)}
.tbtn:active,.menu-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.menu-btn{display:none}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);flex:1}
.side{background:var(--purple);color:var(--on-purple);border-right:3px solid var(--bd)}
.side-h{padding:1.25rem 1rem;text-align:center;border-bottom:2.5px solid rgba(255,248,234,.3);font:700 1.2rem var(--pix);letter-spacing:.12em;text-shadow:1px 1px 0 var(--bd)}
.side-h small{display:block;font:400 .7rem var(--pix);margin-top:.35rem;opacity:.9;letter-spacing:.07em}
.ng{padding:.8rem 0 .4rem;border-bottom:2px solid rgba(255,248,234,.2)}
.ng-l{padding:.2rem 1.1rem .4rem;font:700 .7rem var(--pix);letter-spacing:.12em;opacity:.92;color:var(--yellow)}
.nb{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;color:var(--on-purple);padding:.6rem 1.1rem;cursor:pointer;font:700 .84rem var(--pix);letter-spacing:.05em;transition:background .15s}
.nb::before{content:"";width:.65rem;height:.65rem;background:var(--on-purple);transform:rotate(45deg) scale(.85);flex:none}
.nb:hover{background:rgba(255,248,234,.2);color:#FFF}
.nb[aria-current="page"]{background:var(--pink);color:var(--on-acc);font-weight:700;box-shadow:inset 0 0 0 2px var(--bd)}
.nb[aria-current="page"]::before{background:var(--on-acc)}
main{padding:1.5rem 1.75rem;min-width:0}
.view[hidden]{display:none}
.vh{font:700 1.5rem var(--pix);letter-spacing:.06em;background:var(--cream);border:3px solid var(--bd);box-shadow:4px 4px 0 var(--sh);padding:.7rem 1.1rem;display:block;margin-bottom:.5rem}
.vd{margin:1rem 0 1.4rem;max-width:46rem;color:var(--ink);background:var(--cream2);border-left:6px solid var(--pink);padding:.65rem .95rem;font-size:1.08rem}
.status{background:var(--purple);color:var(--on-purple);border-top:3px solid var(--bd);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;padding:.65rem 1.25rem;font:700 .75rem var(--pix);letter-spacing:.06em}
.dot{display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:#5BD68A;margin-right:.45rem;box-shadow:0 0 4px #5BD68A}

/* windows */
.win{background:var(--cream);border:3px solid var(--bd);box-shadow:5px 5px 0 var(--sh);min-width:0}
.wt{background:var(--purple);color:var(--on-purple);display:flex;align-items:center;gap:.75rem;padding:.55rem .95rem;border-bottom:3px solid var(--bd)}
.dots{display:flex;gap:.35rem}
.dots i{display:block;width:.7rem;height:.7rem;border-radius:50%;background:var(--pink);border:2px solid var(--on-purple)}
.wt h2{flex:1;text-align:center;font:700 1rem var(--pix);letter-spacing:.1em;color:var(--on-purple);text-shadow:1.5px 1.5px 0 var(--bd)}
.wc{font:700 .9rem var(--pix);letter-spacing:.2em;color:var(--on-purple)}
.wb{padding:1.2rem}
.wb.flush{padding:0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.5rem;margin-top:1.5rem}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.inset{border:2.5px solid var(--bd);background:var(--cream2);padding:1rem .85rem;text-align:center;box-shadow:2px 2px 0 rgba(42,29,48,0.08)}
.lbl{font:700 .78rem var(--pix);color:var(--muted);letter-spacing:.08em;margin-bottom:.25rem}
.num{font:700 2.6rem var(--pix);line-height:1.1;color:var(--ink)}
.mut{color:var(--muted);font-weight:600}

/* buttons */
.pbtn{display:inline-block;background:var(--cream2);color:var(--ink);border:3px solid var(--bd);box-shadow:3px 3px 0 var(--sh);padding:.65rem 1.15rem;font:700 .82rem var(--pix);letter-spacing:.07em;cursor:pointer;text-align:center;transition:transform .1s,box-shadow .1s,background .1s}
.pbtn:hover{background:var(--yellow);color:var(--on-acc)}
.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.pbtn.pink{background:var(--pink);color:var(--on-acc)}
.pbtn.sm{padding:.4rem .8rem;font-size:.76rem}
.pbtn.wide{display:block;width:100%}
.pbtn[aria-pressed="true"]{background:var(--green);color:var(--on-acc)}

/* hero */
.hero .wb{display:grid;grid-template-columns:auto 1fr minmax(220px,320px);gap:1.75rem;align-items:center}
.hero h1{font:700 1.85rem var(--pix);letter-spacing:.06em;line-height:1.25;text-transform:uppercase;color:var(--ink)}
.hero p{margin-top:.7rem;color:var(--muted);max-width:28rem;font-size:1.12rem;line-height:1.45;font-weight:500}
.monitor{width:130px;height:auto;display:block}
.sys{border:3px solid var(--bd);box-shadow:4px 4px 0 var(--sh);background:var(--cream2);padding:.85rem 1rem;list-style:none;margin:0}
.sys li{display:flex;justify-content:space-between;gap:.8rem;font:700 .78rem var(--pix);padding:.35rem 0;letter-spacing:.05em;border-bottom:1px dashed rgba(42,29,48,0.2)}
.sys li:last-child{border-bottom:0}
.sys li b{color:var(--ok);font-size:.82rem}

/* dashboard widgets */
.brief{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.brief>div+div{border-left:3px dashed var(--bd);padding-left:1.25rem}
.brief .inset+.inset{margin-top:.85rem}
.big{font:700 1.85rem var(--pix);color:var(--ink)}
.plus{font:700 1.1rem var(--pix);text-align:center;padding:.2rem 0;color:var(--pink)}
.tip{border:2px dashed var(--pink);background:rgba(232,89,139,0.1);color:var(--pink);padding:.5rem;text-align:center;font:700 .74rem var(--pix);margin:.85rem 0;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:3px solid var(--bd)}
.stats>div{padding:1.1rem .6rem;text-align:center;border-right:3px solid var(--bd);background:var(--cream2)}
.stats>div:last-child{border-right:0}
.split{display:grid;grid-template-columns:1fr 1.25fr}
.split>div+div{border-left:3px solid var(--bd)}
.sh{background:var(--purple);color:var(--on-purple);font:700 .82rem var(--pix);letter-spacing:.1em;padding:.55rem .9rem;text-shadow:1px 1px 0 var(--bd)}
.rows{padding:.85rem 1.1rem}
.r{display:flex;justify-content:space-between;gap:.9rem;padding:.45rem 0;border-bottom:1px dashed rgba(42,29,48,0.2);align-items:baseline;font-size:1.08rem}
.r:last-child{border-bottom:0}
.r .lbl{flex:none;font-weight:700;color:var(--muted)}
.r b{font-family:var(--pix);font-size:1.15rem;color:var(--ink)}
.sq{display:inline-block;width:.75rem;height:.75rem;background:var(--purple);margin-right:.6rem;vertical-align:middle}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1rem;text-align:center}
.ico{width:3.2rem;height:3.2rem;margin:0 auto .4rem;border:3px solid var(--bd);background:var(--cream2);box-shadow:3px 3px 0 var(--sh);display:grid;place-items:center;font:700 1.35rem var(--pix);color:var(--purple)}
.ico2{color:var(--pink)}
.strip{border:3px solid var(--bd);background:var(--cream2);padding:.75rem;text-align:center;font:700 .78rem var(--pix);letter-spacing:.06em;margin-top:1rem;color:var(--ink)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.qb{border:3px solid var(--bd);box-shadow:4px 4px 0 var(--sh);min-height:6rem;cursor:pointer;font:700 .88rem var(--pix);letter-spacing:.07em;color:var(--on-acc);padding:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;text-align:center;transition:transform .1s,box-shadow .1s,filter .15s}
.qb b{font-size:1.5rem}
.qb:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sh)}
.qb:hover{filter:brightness(1.08);transform:translateY(-1px)}
.bg-pink{background:var(--pink)}.bg-yellow{background:var(--yellow)}.bg-lav{background:var(--lav)}.bg-green{background:var(--green)}

/* lists and forms */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:block}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip span{display:block;padding:.45rem .8rem;border:2px solid var(--bd);background:var(--cream2);font-size:1rem}
.chip:hover span{background:var(--yellow);color:var(--on-acc)}
.chip input:checked + span{background:var(--purple);color:var(--on-purple)}
.chip input:focus-visible + span{outline:3px solid var(--pink);outline-offset:2px}
fieldset{border:0;margin:0 0 1.1rem;padding:0;min-width:0}
legend{font:700 .74rem var(--pix);letter-spacing:.05em;margin-bottom:.5rem;padding:0}
.goals{display:grid;gap:.5rem}
.goals .chip span{padding:.6rem .8rem}
.goals b{display:block;font-weight:600}
.goals small{display:block;font-size:.9rem;opacity:.85}
.field{display:block;margin-bottom:1rem}
.field>span{display:block;font:700 .72rem var(--pix);letter-spacing:.05em;margin-bottom:.35rem}
.in{width:100%;max-width:26rem;background:var(--cream2);border:3px solid var(--bd);padding:.5rem .65rem;font-size:1.05rem;border-radius:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:center;padding:.65rem 0;border-bottom:2px dashed color-mix(in srgb,var(--bd) 50%,transparent)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted)}
.rowbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.msg{margin-top:.9rem;padding:.55rem .8rem;border:3px solid var(--bd);background:var(--green);color:var(--on-acc);font-weight:500}
.msg:empty{display:none}
.two{display:grid;grid-template-columns:.9fr 1.1fr;gap:1.6rem}
.tag{display:inline-block;background:var(--yellow);color:var(--on-acc);padding:.05rem .5rem;border:2px solid var(--bd);font:700 .62rem var(--pix);margin-bottom:.5rem}
.tag.mute{background:var(--lav)}
.pick{border-left:8px solid var(--pink);padding-left:1rem;margin-bottom:1.2rem}
.pick h3{font:700 1.15rem var(--pix);margin-bottom:.5rem;letter-spacing:.03em}
.pick p{margin-bottom:.6rem}
ul.tips{margin:0 0 .9rem;padding-left:1.1rem;color:var(--muted)}
details.alt{border-top:2px dashed color-mix(in srgb,var(--bd) 50%,transparent);padding:.6rem 0}
details.alt summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:center;font:700 .8rem var(--pix);list-style:none}
details.alt summary::-webkit-details-marker{display:none}
details.alt summary::before{content:"+";width:1rem;color:var(--pink)}
details.alt[open] summary::before{content:"\2212"}
details.alt .tag{margin:0}
details.alt .dbody{padding:.6rem 0 0 1.6rem}
.bar{display:grid;grid-template-columns:5.5rem 1fr 2rem;gap:.6rem;align-items:center;margin:.45rem 0}
.bar i{display:block;height:1.1rem;background:var(--pink);border:2px solid var(--bd);min-width:2px}
.bar .lbl{color:var(--ink)}
.oc{font:700 1rem var(--pix)}
.sm-list li{padding:.4rem 0}

@media (max-width:1000px){
  .s4,.s5,.s6,.s7{grid-column:span 12}
  .hero .wb{grid-template-columns:auto 1fr}
  .hero .sys{grid-column:1 / -1}
}
@media (max-width:820px){
  .menu-btn{display:block}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{display:none;border-right:0;border-bottom:3px solid var(--bd)}
  .side.open{display:block}
  .bsub{display:none}
  .two,.brief,.split{grid-template-columns:1fr}
  .brief>div+div{border-left:0;padding-left:0;border-top:3px dashed var(--bd);padding-top:1rem}
  .split>div+div{border-left:0;border-top:3px solid var(--bd)}
  main{padding:.9rem}
  .hero .wb{grid-template-columns:1fr}
  .monitor{width:96px}
}
@media (max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats>div:nth-child(2){border-right:0}
  .stats>div:nth-child(-n+2){border-bottom:3px solid var(--bd)}
  .acts4{grid-template-columns:repeat(2,1fr)}
  .tb-actions .tbtn{padding:.3rem .5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ECOWEAR functional extensions — keeps the original pixel interface */
:root[data-persona="female"]{--purple:#C26B85;--purple-d:#8A3D54;--pink:#E88CA7;--yellow:#F6C1D0;--green:#B4D9B6;--lav:#ECC0CE;--marble:#F5D6E0;--marble2:#FBE8EF}
:root[data-persona="male"]{--purple:#4A6B82;--purple-d:#2E475A;--pink:#6C90AF;--yellow:#9BBAD4;--green:#92C9B6;--lav:#B9D0E3;--marble:#D2E0EB;--marble2:#E4ECF2}
.gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem 1rem}
.gate[hidden],.app[hidden]{display:none}
.gate-wrap{width:min(880px,94vw);margin:0 auto}
.gate-brand{text-align:center;font:700 clamp(2.5rem,7vw,4.8rem) var(--pix);letter-spacing:.12em;margin-bottom:.3rem;color:#FFF8EA;text-shadow:4px 4px 0 var(--purple-d),6px 6px 0 var(--bd)}
.gate-tag-wrap{text-align:center;margin-bottom:1.2rem}
.gate-tag{text-align:center;font:700 .78rem var(--pix);letter-spacing:.08em;color:#3A2460;background:#C4A9E2;display:inline-block;padding:.25rem .85rem;border:2px solid var(--bd);box-shadow:3px 3px 0 var(--sh)}
.gate-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}

/* Header title readability */
.wt h2{flex:1;text-align:center;font:700 .95rem var(--pix);letter-spacing:.1em;color:#FFF8EA!important;text-shadow:1px 1px 0 var(--bd)}

/* Landing 2-column retro layout */
.landing-win{width:100%}
.landing-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:1.4rem;align-items:stretch}
.landing-info{display:flex;flex-direction:column;justify-content:space-between;padding:1.4rem;background:var(--cream2);border:3px solid var(--bd);box-shadow:3px 3px 0 var(--sh)}
.landing-headline{font:700 clamp(1.35rem,2.2vw,1.85rem) var(--pix);letter-spacing:.05em;line-height:1.35;color:#FFF8EA;background:var(--purple);border:2px solid var(--bd);box-shadow:3px 3px 0 var(--sh);padding:.55rem .8rem;margin-bottom:.8rem;text-transform:uppercase;text-shadow:2px 2px 0 var(--bd)}
.landing-subtext{font-size:1.05rem;color:var(--ink);line-height:1.48;margin-bottom:1.25rem}
.landing-features{display:flex;flex-direction:column;gap:.75rem;margin-top:auto}
.feat-card{display:flex;align-items:center;gap:.8rem;padding:.7rem .85rem;background:var(--cream);border:2px solid var(--bd);box-shadow:2px 2px 0 var(--sh)}
.feat-icon{font-size:1.4rem;width:2.5rem;height:2.5rem;display:grid;place-items:center;background:var(--lav);border:2px solid var(--bd);flex:none}
.feat-card b{display:block;font:700 .82rem var(--pix);letter-spacing:.04em;color:var(--ink)}
.feat-card small{display:block;font-size:.88rem;color:var(--muted);line-height:1.28}
.landing-auth{display:flex;flex-direction:column;justify-content:center}
.auth-box{background:var(--cream2);border:3px solid var(--bd);box-shadow:3px 3px 0 var(--sh);padding:1.45rem;display:flex;flex-direction:column;gap:1rem;height:100%;justify-content:center}
.auth-title{font:700 1.15rem var(--pix);letter-spacing:.08em;color:var(--purple-d);border-bottom:2px solid var(--bd);padding-bottom:.45rem;margin-bottom:.2rem}
.auth-desc{font-size:.98rem;color:var(--muted);line-height:1.45}
.gate-actions-v{display:flex;flex-direction:column;gap:.85rem;margin:.4rem 0}
.pbtn.lg{padding:.85rem 1.25rem;font-size:.88rem;letter-spacing:.08em}
.pbtn.yellow{background:var(--yellow);color:var(--on-acc)}
.pbtn.yellow:hover{background:var(--lav)}
.field.lg span{font:700 .78rem var(--pix);letter-spacing:.06em;margin-bottom:.35rem;display:block}
.in.lg{padding:.7rem .85rem;border:3px solid var(--bd);background:var(--cream);width:100%;font-size:1.05rem}
.in.lg:focus{outline:3px solid var(--pink);outline-offset:1px;background:#fff}
.auth-btn-row{display:flex;gap:.6rem;margin-top:.6rem}

/* Onboarding Card & Form Sizing */
.onboarding-wrap{width:min(720px,94vw);margin:0 auto}
.gate-nav{display:flex;justify-content:flex-start;margin-bottom:.85rem}
.back-btn{font:700 .72rem var(--pix);letter-spacing:.06em;padding:.42rem .9rem;background:var(--cream2);color:var(--ink);border:3px solid var(--bd);box-shadow:3px 3px 0 var(--sh);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.back-btn:hover{background:var(--yellow);color:var(--on-acc)}
.back-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.profile-box{padding:1.6rem;display:flex;flex-direction:column;gap:1.25rem}
.profile-box .form-grid{gap:1.2rem}
.profile-box .field span,.profile-box legend{font:700 .82rem var(--pix);letter-spacing:.06em;margin-bottom:.45rem;display:block}
.profile-box .in{padding:.75rem .9rem;border:3px solid var(--bd);background:var(--cream);font-size:1.05rem;width:100%}
.profile-box .in:focus{outline:3px solid var(--pink);outline-offset:1px;background:#fff}
.profile-box .chip span{padding:.65rem 1.1rem;font-size:1.05rem;font-weight:500}
.profile-box .pbtn.submit-btn{padding:.85rem 1.8rem;font-size:.88rem;font-weight:700;letter-spacing:.08em;width:100%;margin-top:.5rem}

.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:1rem}
.progress i{height:.7rem;border:2px solid var(--bd);background:var(--cream2)}
.progress i.on{background:var(--pink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.form-grid .full{grid-column:1/-1}
.notice{border:2px dashed var(--bd);padding:.6rem .8rem;margin:.8rem 0;background:var(--cream2);font-size:.94rem}
.error{background:var(--pink);color:var(--on-acc)}
.item-main{display:flex;align-items:center;gap:.8rem;min-width:0}
.item-photo{width:70px;height:70px;object-fit:cover;border:3px solid var(--bd);background:var(--lav);image-rendering:auto;flex:none}
.item-photo.sm{width:54px;height:54px}
.item-photo.lg{width:96px;height:96px}
.item-placeholder{display:grid;place-items:center;font:700 .7rem var(--pix);color:var(--muted)}
.outfit-card{display:flex;align-items:center;gap:.6rem;text-align:left}
.upload-preview{width:120px;height:120px;object-fit:cover;border:3px solid var(--bd);background:var(--cream2);display:none;margin:.5rem 0}
.personal-note{border-left:6px solid var(--green);background:var(--cream2);padding:.55rem .8rem;margin:.8rem 0}
.storage-alert{position:fixed;z-index:20;right:1rem;bottom:1rem;max-width:28rem;background:var(--pink);color:var(--on-acc);border:3px solid var(--bd);box-shadow:4px 4px 0 var(--sh);padding:.7rem}
@media(max-width:768px){.landing-grid{grid-template-columns:1fr;gap:1rem}.gate-wrap{width:100%}}
@media(max-width:620px){.topbar{flex-wrap:wrap}.brand{width:100%;justify-content:center}.tb-actions{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35rem}.tb-actions .tbtn,.tb-actions .menu-btn{width:100%;padding:.35rem .15rem;font-size:.58rem}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.gate{align-items:start;padding-top:1rem}.item-photo{width:58px;height:58px}.row{align-items:flex-start}}
</style>
</head>
<body>
<div id="gate" class="gate"></div>
<div class="app" id="appShell" hidden>
  <header class="topbar">
    <div class="brand"><span class="bmark">ECOWEAR</span><span class="bsub">&lt; your circular style system &gt;</span></div>
    <div class="tb-actions">
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="side">Menu</button>
      <button class="tbtn" type="button" data-go="settings">Profile</button>
      <button class="tbtn" type="button" data-go="help">Help</button>
      <button class="tbtn" type="button" id="logoutBtn">Log out</button>
    </div>
  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="side-h">ECOWEAR<small>System menu</small></div>
      <nav id="nav" aria-label="Main"></nav>
    </aside>
    <main id="main">
      <section class="view" id="v-dashboard" hidden></section>
      <section class="view" id="v-closet" hidden></section>
      <section class="view" id="v-add" hidden></section>
      <section class="view" id="v-outfit" hidden></section>
      <section class="view" id="v-recs" hidden></section>
      <section class="view" id="v-route" hidden></section>
      <section class="view" id="v-impact" hidden></section>
      <section class="view" id="v-settings" hidden></section>
      <section class="view" id="v-help" hidden></section>
    </main>
  </div>
  <footer class="status">
    <span><i class="dot" aria-hidden="true"></i>System status: online</span>
    <span>Thank you for making fashion more circular!</span>
    <span id="clock"></span>
  </footer>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var DAY=864e5, KEY='rewear:v2';
var CATS=['Tops','Bottoms','Dresses','Shoes','Outerwear'];
var WEATHER={
  hot:{l:'Hot',r:'30°C and above',s:'Light, breathable clothing'},
  warm:{l:'Warm',r:'22–29°C',s:'Light / casual clothing'},
  mild:{l:'Mild',r:'15–21°C',s:'Layers you can add or remove'},
  cool:{l:'Cool',r:'Below 15°C',s:'Warm layers'}
};
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- data ---------- */
function seed(){
  var now=Date.now();
  function mk(name,cat,wears,ago,last){return {id:uid(),name:name,cat:cat,wears:wears,added:now-ago*DAY,last:last===null?null:now-last*DAY,sample:true};}
  return [
    mk('White T-shirt','Tops',9,40,0), mk('Striped shirt','Tops',4,25,6), mk('Black tank top','Tops',2,3,2), mk('Olive sweater','Tops',1,60,30),
    mk('Blue jeans','Bottoms',12,90,1), mk('Black trousers','Bottoms',3,45,9), mk('Denim shorts','Bottoms',2,2,4),
    mk('Floral dress','Dresses',2,30,14),
    mk('White sneakers','Shoes',8,70,0), mk('Brown boots','Shoes',1,50,40),
    mk('Brown jacket','Outerwear',1,120,50), mk('Rain jacket','Outerwear',0,1,null)
  ];
}
function defaults(){return {name:'Member',theme:'auto',weather:'warm',rain:false,shuffle:0,items:seed(),log:[],saved:[]};}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var p=JSON.parse(r); if(p&&Array.isArray(p.items)&&Array.isArray(p.log)){var d=defaults(); for(var k in p){d[k]=p[k];} if(!Array.isArray(d.saved)) d.saved=[]; return d;}}
  }catch(e){}
  return defaults();
}
var S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function applyTheme(){
  var r=document.documentElement;
  if(S.theme==='light'||S.theme==='dark') r.setAttribute('data-theme',S.theme); else r.removeAttribute('data-theme');
}

/* ---------- helpers ---------- */
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function rel(ts){
  if(!ts) return 'Never';
  var d=Math.round((sod(Date.now())-sod(ts))/DAY);
  if(d<=0) return 'Today'; if(d===1) return 'Yesterday'; return d+' days ago';
}
function stats(){
  var it=S.items, tw=it.reduce(function(a,i){return a+i.wears;},0);
  var byW=it.slice().sort(function(a,b){return b.wears-a.wears;});
  var recent=it.filter(function(i){return i.last;}).sort(function(a,b){return b.last-a.last;})[0];
  var c={}; CATS.forEach(function(k){c[k]=it.filter(function(i){return i.cat===k;}).length;});
  var a={swap:0,resell:0,donate:0,recycle:0,repair:0};
  S.log.forEach(function(l){if(a[l.action]!==undefined) a[l.action]++;});
  return {n:it.length,tw:tw,most:byW[0],least:byW[byW.length-1],recent:recent,
    added:it.filter(function(i){return Date.now()-i.added<7*DAY;}).length,c:c,a:a,
    kept:it.filter(function(i){return i.wears>0;}).length,
    lives:a.swap+a.resell+a.donate,
    circ:a.swap+a.resell+a.donate+a.recycle+a.repair};
}
function outfit(){
  var w=S.weather,it=S.items;
  function pick(cat){
    var c=it.filter(function(i){return i.cat===cat;}).sort(function(a,b){return a.wears-b.wears||a.name.localeCompare(b.name);});
    if(!c.length) return null;
    var pool=c.slice(0,3); return pool[S.shuffle%pool.length];
  }
  var parts=[], hasDress=it.some(function(i){return i.cat==='Dresses';});
  var dressy=(w==='hot'||w==='warm')&&S.shuffle%2===1&&hasDress;
  if(dressy) parts.push(pick('Dresses')); else {parts.push(pick('Tops')); parts.push(pick('Bottoms'));}
  parts.push(pick('Shoes'));
  if(w==='cool'||S.rain) parts.push(pick('Outerwear'));
  return parts.filter(Boolean);
}
function win(title,body,cls,flush){
  return '<section class="win '+(cls||'')+'"><header class="wt"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><h2><span aria-hidden="true">♥</span> '+title+' <span aria-hidden="true">♥</span></h2><span class="wc" aria-hidden="true">– □ ×</span></header><div class="wb'+(flush?' flush':'')+'">'+body+'</div></section>';
}
function head(t,d){return '<h1 class="vh" tabindex="-1">'+t+'</h1>'+(d?'<p class="vd">'+d+'</p>':'');}

/* ---------- navigation ---------- */
var NAV=[
  ['Main',[['dashboard','Dashboard']]],
  ['My wardrobe',[['closet','My closet'],['add','Add clothes']]],
  ['Style',[['outfit','Today’s outfit'],['recs','Recommendations']]],
  ['Circular fashion',[['route:repair','Repair'],['route:swap','Swap'],['route:resell','Resell'],['route:donate','Donate'],['route:recycle','Recycle']]],
  ['Insights',[['impact','My impact']]],
  ['Account',[['settings','Settings'],['help','Help']]]
];
$('#nav').innerHTML=NAV.map(function(g){
  return '<div class="ng"><div class="ng-l">'+g[0].toUpperCase()+'</div>'+g[1].map(function(i){return '<button type="button" class="nb" data-go="'+i[0]+'">'+i[1]+'</button>';}).join('')+'</div>';
}).join('');

var cur='dashboard', route='repair', flash='', closetFilter='All';
function show(id){
  var parts=id.split(':'), v=parts[0];
  if(id!==cur) flash='';
  cur=id; if(parts[1]) route=parts[1];
  $$('.view').forEach(function(x){x.hidden=x.id!=='v-'+v;});
  $$('#nav .nb').forEach(function(b){ if(b.getAttribute('data-go')===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  render(v);
  closeMenu();
  var h=$('#v-'+v+' .vh'); if(h) h.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function render(v){
  ({dashboard:rDash,closet:rCloset,outfit:rOutfit,route:rRoute,impact:rImpact,recs:rRecsSaved,settings:rSettings})[v]&&({dashboard:rDash,closet:rCloset,outfit:rOutfit,route:rRoute,impact:rImpact,recs:rRecsSaved,settings:rSettings})[v]();
}
function refresh(){render(cur.split(':')[0]);}
function closeMenu(){$('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');}
$('#menuBtn').addEventListener('click',function(){
  var o=$('#side').classList.toggle('open'); this.setAttribute('aria-expanded',o?'true':'false');
});

/* ---------- dashboard ---------- */
function heartSvg(){
  var g=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'], r='';
  g.forEach(function(row,y){for(var x=0;x<row.length;x++){if(row[x]==='X') r+='<rect x="'+(x*5)+'" y="'+(y*5)+'" width="5" height="5"/>';}});
  return r;
}
function greet(){var h=new Date().getHours(); return h<12?'Good morning':(h<18?'Good afternoon':'Good evening');}
function rDash(){
  var st=stats(), o=outfit(), w=WEATHER[S.weather];
  var hero='<section class="win hero"><div class="wb">'+
    '<svg class="monitor" viewBox="0 0 110 100" role="img" aria-label="Pixel computer showing a heart" shape-rendering="crispEdges">'+
    '<rect x="4" y="4" width="102" height="72" fill="#2A1D30"/><rect x="8" y="8" width="94" height="64" fill="#7452A8"/>'+
    '<g transform="translate(37,26)" fill="#E8598B">'+heartSvg()+'</g>'+
    '<rect x="44" y="76" width="22" height="10" fill="#2A1D30"/><rect x="26" y="86" width="58" height="8" fill="#D9C9A8" stroke="#2A1D30" stroke-width="3"/></svg>'+
    '<div><h1 class="vh" tabindex="-1" style="all:unset;display:block;font:700 1.5rem var(--pix);letter-spacing:.05em;line-height:1.3;text-transform:uppercase">'+greet()+',<br>'+esc(S.name)+'</h1>'+
    '<p>Your wardrobe, your style, and your circular fashion journey, all in one place.</p></div>'+
    '<ul class="sys" aria-label="System status"><li><span>Wardrobe system</span><b>READY</b></li><li><span>Style system</span><b>READY</b></li><li><span>Circular tracking</span><b>READY</b></li></ul>'+
    '</div></section>';
  var outHtml=o.length?o.map(function(i){return '<div class="inset outfit-card">'+itemThumb(i,'sm')+'<b>'+esc(i.name)+'</b></div>';}).join('<div class="plus" aria-hidden="true">+</div>'):'<div class="inset mut">Add clothes to get outfit ideas</div>';
  var brief=win('Today’s style brief','<div class="brief"><div><div class="lbl" style="margin-bottom:.5rem">TODAY’S WEATHER</div><div class="inset"><div class="big">'+w.l.toUpperCase()+'</div><div class="mut">'+w.r+(S.rain?' · Rain':'')+'</div></div><div class="inset"><div class="lbl">SUITABLE FOR</div>'+w.s+'</div></div>'+
    '<div><div class="lbl" style="margin-bottom:.5rem">TODAY’S OUTFIT</div>'+outHtml+'<div class="tip">Picked from your least-worn pieces</div><button class="pbtn wide" type="button" data-go="outfit">View recommendation</button></div></div>','s5');
  var cats=CATS.map(function(k){return '<div class="r"><span><i class="sq"></i>'+k+'</span><b>'+st.c[k]+'</b></div>';}).join('');
  var wardrobe=win('My wardrobe',
    '<div class="stats"><div><div class="lbl">TOTAL ITEMS</div><div class="num">'+st.n+'</div></div><div><div class="lbl">TOTAL WEARS</div><div class="num">'+st.tw+'</div></div><div><div class="lbl">MOST WORN</div><div class="num">'+(st.most?st.most.wears:0)+'</div></div><div><div class="lbl">RECENTLY ADDED</div><div class="num">'+st.added+'</div></div></div>'+
    '<div class="split"><div><div class="sh">CATEGORIES</div><div class="rows">'+cats+'</div></div><div><div class="sh">CLOSET ACTIVITY</div><div class="rows">'+
    '<div class="r"><span class="lbl">TOTAL WEARS</span><b>'+st.tw+'</b></div>'+
    '<div class="r"><span class="lbl">MOST WORN</span><span>'+(st.most?esc(st.most.name)+' · '+st.most.wears+' wears':'None yet')+'</span></div>'+
    '<div class="r"><span class="lbl">LEAST USED</span><span>'+(st.least?esc(st.least.name)+' · '+st.least.wears+(st.least.wears===1?' wear':' wears'):'None yet')+'</span></div>'+
    '<div class="r"><span class="lbl">RECENTLY WORN</span><span>'+(st.recent?esc(st.recent.name)+' · '+rel(st.recent.last):'None yet')+'</span></div>'+
    '</div></div></div>','s7',true);
  var act=win('Circular activity',
    '<div class="acts4">'+[['swap','⇄','Swapped'],['resell','$','Resold'],['donate','♥','Donated'],['recycle','↻','Recycled']].map(function(x){return '<div><div class="ico">'+x[1]+'</div><div class="lbl">'+x[2].toUpperCase()+'</div><div class="oc">'+st.a[x[0]]+'</div></div>';}).join('')+'</div>'+
    '<div class="inset"><div class="lbl">TOTAL CIRCULAR ACTIONS</div><div class="num">'+st.circ+'</div></div><button class="pbtn wide" type="button" data-go="impact" style="margin-top:.8rem">View activity</button>','s4');
  var msg=st.circ?'Your closet is getting more circular.':'Log your first circular action to get started.';
  var imp=win('Your circular impact',
    '<div class="acts4" style="grid-template-columns:repeat(2,1fr)"><div class="inset"><div class="lbl">KEPT IN USE</div><div class="num">'+st.kept+'</div><div class="lbl">ITEMS</div></div><div class="inset"><div class="lbl">GIVEN A SECOND LIFE</div><div class="num">'+st.lives+'</div></div><div class="inset"><div class="lbl">REPAIRS</div><div class="num">'+st.a.repair+'</div></div><div class="inset"><div class="lbl">RECYCLED</div><div class="num">'+st.a.recycle+'</div></div></div>'+
    '<div class="strip"><span aria-hidden="true">◆</span> '+msg+'</div>','s4');
  var qa=win('Quick actions','<div class="qa"><button class="qb bg-pink" type="button" data-go="add"><b aria-hidden="true">+</b>Add clothes</button><button class="qb bg-yellow" type="button" data-go="outfit"><b aria-hidden="true">◆</b>Style me</button><button class="qb bg-lav" type="button" data-go="closet"><b aria-hidden="true">▣</b>My closet</button><button class="qb bg-green" type="button" data-go="impact"><b aria-hidden="true">◆</b>View impact</button></div>','s4');
  $('#v-dashboard').innerHTML=hero+'<div class="grid">'+brief+wardrobe+act+imp+qa+'</div>';
}

/* ---------- closet ---------- */
function initCloset(){
  $('#v-closet').innerHTML=head('My closet','Everything you own, sorted by category. Tap “Wore it today” to keep your wear counts honest.')+
    win('Closet','<fieldset><legend>Show</legend><div class="chips" id="cf">'+['All'].concat(CATS).map(function(c,i){return '<label class="chip"><input type="radio" name="cf" value="'+c+'"'+(i===0?' checked':'')+'><span>'+c+'</span></label>';}).join('')+'</div></fieldset><ul class="list" id="closetList"></ul>');
  $('#cf').addEventListener('change',function(e){closetFilter=e.target.value; rCloset();});
}
function rCloset(){
  var list=S.items.filter(function(i){return closetFilter==='All'||i.cat===closetFilter;}).sort(function(a,b){return a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name);});
  $('#closetList').innerHTML=list.length?list.map(function(i){
    return '<li class="row"><div><b>'+esc(i.name)+'</b><small>'+i.cat+' · '+i.wears+(i.wears===1?' wear':' wears')+' · last worn '+rel(i.last).toLowerCase()+'</small></div><div class="rowbtns"><button class="pbtn sm" type="button" data-wore="'+i.id+'">Wore it today</button><button class="pbtn sm" type="button" data-del="'+i.id+'" aria-label="Remove '+esc(i.name)+'">Remove</button></div></li>';
  }).join(''):'<li class="mut" style="padding:.8rem 0">Nothing here yet. <button class="pbtn sm" type="button" data-go="add">Add clothes</button></li>';
}

/* ---------- add ---------- */
function initAdd(){
  $('#v-add').innerHTML=head('Add clothes','Add what you already own. The more accurate your closet, the better your outfit ideas.')+
    win('New item','<form id="addForm"><label class="field"><span>ITEM NAME</span><input class="in" id="aName" required maxlength="60" placeholder="e.g. Green corduroy jacket" autocomplete="off"></label>'+
    '<label class="field"><span>CATEGORY</span><select class="in" id="aCat">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label>'+
    '<label class="field"><span>TIMES WORN SO FAR</span><input class="in" id="aWears" type="number" min="0" max="999" value="0" inputmode="numeric"></label>'+
    '<button class="pbtn pink" type="submit">Add to closet</button><div class="msg" id="addMsg" role="status"></div></form>');
  $('#addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('#aName').value.trim(); if(!name) return;
    var wears=Math.max(0,Math.min(999,parseInt($('#aWears').value,10)||0));
    S.items.push({id:uid(),name:name,cat:$('#aCat').value,wears:wears,added:Date.now(),last:null});
    persist();
    $('#addMsg').textContent='Added “'+name+'” to your closet.';
    $('#aName').value=''; $('#aWears').value='0'; $('#aName').focus();
  });
}

/* ---------- outfit ---------- */
function initOutfit(){
  $('#v-outfit').innerHTML=head('Today’s outfit','Tell us the weather and we’ll suggest an outfit from your least-worn pieces, so more of your closet gets used.')+
    win('Outfit builder','<div class="two"><div><fieldset><legend>Weather</legend><div class="chips" id="wf">'+Object.keys(WEATHER).map(function(k){return '<label class="chip"><input type="radio" name="wf" value="'+k+'"'+(S.weather===k?' checked':'')+'><span>'+WEATHER[k].l+' ('+WEATHER[k].r+')</span></label>';}).join('')+'</div></fieldset>'+
    '<fieldset><legend>Rain</legend><div class="chips"><label class="chip"><input type="checkbox" id="rain"'+(S.rain?' checked':'')+'><span>It’s raining</span></label></div></fieldset></div>'+
    '<div id="outRes" aria-live="polite"></div></div>');
  $('#wf').addEventListener('change',function(e){S.weather=e.target.value; S.shuffle=0; persist(); rOutfit();});
  $('#rain').addEventListener('change',function(e){S.rain=e.target.checked; persist(); rOutfit();});
}
function rOutfit(){
  var o=outfit(), w=WEATHER[S.weather], html;
  if(!o.length){html='<p class="mut">Add some clothes first, then come back for an outfit.</p><p style="margin-top:.8rem"><button class="pbtn pink" type="button" data-go="add">Add clothes</button></p>';}
  else{
    var need=['Tops','Bottoms','Shoes'].filter(function(c){return !S.items.some(function(i){return i.cat===c;});});
    html='<div class="lbl">SUITABLE FOR</div><p style="margin-bottom:.8rem">'+w.s+(S.rain?', plus something waterproof':'')+'</p>'+
      '<ul class="list">'+o.map(function(i){return '<li class="row"><div class="item-main">'+itemThumb(i,'sm')+'<div><b>'+esc(i.name)+'</b><small>'+i.cat+' · '+esc(i.colour||'Colour not set')+' · '+i.wears+(i.wears===1?' wear':' wears')+'</small></div></div></li>';}).join('')+'</ul>'+personalReason(o)+
      (need.length?'<p class="mut" style="margin-top:.6rem">Add some '+need.join(' and ').toLowerCase()+' to complete outfits.</p>':'')+
      '<div class="rowbtns" style="margin-top:1rem"><button class="pbtn" type="button" id="shuf">Try another</button><button class="pbtn pink" type="button" id="woreOutfit">I wore this</button></div><div class="msg" id="outMsg" role="status">'+esc(flash)+'</div>';
  }
  $('#outRes').innerHTML=html;
  var sh=$('#shuf'); if(sh) sh.addEventListener('click',function(){S.shuffle++; persist(); flash=''; rOutfit(); var b=$('#shuf'); if(b) b.focus();});
  var wo=$('#woreOutfit'); if(wo) wo.addEventListener('click',function(){
    var ids=o.map(function(i){return i.id;});
    S.items.forEach(function(i){if(ids.indexOf(i.id)>-1){i.wears++; i.last=Date.now();}});
    S.shuffle++; persist(); flash='Nice. Wear counts updated.'; rOutfit();
  });
}

/* ---------- recommender ---------- */
var FLOWS={
  get:{label:'Find something to wear',q:[
    {id:'item',label:'What are you looking for?',o:[['occasion','An outfit for an event'],['everyday','Everyday clothes'],['outer','Coat, jacket or shoes'],['kids','Kids’ clothes']]},
    {id:'use',label:'How often will you wear it?',o:[['once','Once'],['few','A few times'],['often','Regularly, for years']]},

      var savedProfile = Object.assign({}, u.preferences || {}, u.profile || {});

          restoredProfile[k] = savedProfile[k];
        }
      }
      for (var k in savedProfile) {
        if (savedProfile[k] !== undefined && savedProfile[k] !== null && savedProfile[k] !== '') {
          restoredProfile[k] = savedProfile[k];
        }
      }
      
      if (!restoredProfile.gender && (u.theme === 'female' || u.theme === 'male')) {
        restoredProfile.gender = u.theme === 'female' ? 'Female' : 'Male';
      }
      S.profile = restoredProfile;

      var g = (restoredProfile.gender || '').toLowerCase();
      if (u.theme === 'female' || u.theme === 'male') {
        S.theme = u.theme;
      } else if (g.indexOf('female') > -1) {
        S.theme = 'female';
      } else if (g.indexOf('male') > -1) {
        S.theme = 'male';
      } else {

      }

      var hasProfileData = !!(g || restoredProfile.age || restoredProfile.bodyType || (restoredProfile.styles && restoredProfile.styles.length));
      if (!signup && (u.onboardingComplete || u.onboardingStep === 'complete' || hasProfileData)) {
        S.onboardingComplete = true;
        S.onboardingStep = 'complete';
      } else {
        S.onboardingStep = u.onboardingStep || (signup ? 'profile' : 'complete');
